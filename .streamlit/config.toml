[server]
port                           = 8501
headless                       = true
runOnSave                      = false
enableCORS                     = true
enableXsrfProtection           = true
enableStaticServing            = true
fileWatcherType                = "poll"
maxCachedMessageAge            = 3600

[browser]
gatherUsageStats               = false
serverAddress                  = "localhost"
serverPort                     = 8501

[client]
showErrorDetails               = false
toolbarMode                    = "viewer"

[logger]
level                          = "info"

[runner]
magicEnabled                   = false
fastReruns                     = true

[theme]
base                           = "light"
primaryColor                   = "#4F46E5"
backgroundColor                = "#FFFFFF"
secondaryBackgroundColor       = "#F5F7FB"
textColor                      = "#0F172A"
font                           = "sans serif"
